services:
  app:
    image: fanka:latest
    container_name: fanka
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      # 只读挂载安装包清单，下载页在服务端直接读取版本信息
      - /home/ubuntu/downloads:/srv/dl:ro
    networks:
      - web

  ai-worker:
    image: fanka:latest
    container_name: fanka-ai-worker
    restart: unless-stopped
    env_file: .env
    environment:
      AI_TASK_WORKER_URL: http://app:3000/api/v1/internal/ai-tasks/process
    command: ["node", "scripts/ai-task-worker.mjs"]
    depends_on:
      - app
    networks:
      - web

  metrics-agent:
    image: fanka:latest
    container_name: fanka-metrics
    restart: unless-stopped
    env_file: .env
    # 进程监控需要宿主机进程视图与只读 /proc；指标只读采集，不提供任何命令执行能力。
    pid: host
    environment:
      METRICS_APP_URL: http://app:3000
      CADDY_LOG_PATH: /var/log/caddy/access.log
    volumes:
      - /proc:/host/proc:ro
      - caddy_logs:/var/log/caddy:ro
    command: ["node", "scripts/metrics-agent.mjs"]
    depends_on:
      - app
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 安装包目录：只读挂载，由 Caddy 直接对外提供下载
      - /home/ubuntu/downloads:/srv/dl:ro
      - caddy_logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
