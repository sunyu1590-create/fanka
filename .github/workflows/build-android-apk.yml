name: Build HEIKA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/phase-one
      - android/phase-two
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
          EXPO_PUBLIC_API_BASE_URL: https://moonclean.shop
        run: npx expo prebuild --platform android
      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Verify release APK
        working-directory: mobile/android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          badging="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | head -n 1
          printf '%s\n' "$badging" | grep -F "name='com.heika.community' versionCode='4' versionName='2.1.0'"
          sha256sum "$apk"
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: heika-android-preview-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
