name: HEIKA Native 3.0 Android

on:
  push:
    branches: ["**"]
    paths:
      - "native-android/**"
      - "components/Community.tsx"
      - "app/design-system.css"
      - ".github/workflows/heika-native-3-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - "components/Community.tsx"
      - "app/design-system.css"
      - ".github/workflows/heika-native-3-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heika-native-3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, lint, and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install API 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        working-directory: native-android
        run: ./gradlew --version

      - name: Run unit tests and Android lint
        working-directory: native-android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug and unsigned release APKs
        working-directory: native-android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Prepare versioned artifacts
        working-directory: native-android
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/HEIKA-${version_name}-${version_code}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "artifacts/HEIKA-${version_name}-${version_code}-release-unsigned.apk"
          {
            echo "applicationId=com.heika.community"
            echo "versionName=${version_name}"
            echo "versionCode=${version_code}"
            echo "commit=${GITHUB_SHA}"
            echo "releaseSigning=unsigned; inspection only"
            sha256sum artifacts/*.apk
          } > artifacts/BUILD-INFO.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HEIKA-Native-3-v${{ github.sha }}
          path: native-android/artifacts/*
          if-no-files-found: error
          retention-days: 14
