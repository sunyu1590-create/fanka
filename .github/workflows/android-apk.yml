name: HEIKA Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "lib/native-bridge.ts"
      - "components/Community.tsx"
      - "components/Messages.tsx"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "lib/native-bridge.ts"
      - "components/Community.tsx"
      - "components/Messages.tsx"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heika-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Validate Web bridge and business app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android-apk:
    name: Build Android APKs
    needs: web-validation
    runs-on: ubuntu-latest
    env:
      HEIKA_WEB_URL: ${{ vars.HEIKA_WEB_URL || 'https://moonclean.shop/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android static and unit checks
        run: gradle --no-daemon -p android -PheikaWebUrl="$HEIKA_WEB_URL" :app:lintDebug :app:testDebugUnitTest
      - name: Android debug compilation check
        run: gradle --no-daemon -p android -PheikaWebUrl="$HEIKA_WEB_URL" :app:compileDebugKotlin :app:compileDebugJavaWithJavac
      - name: Assemble debug and release APKs
        run: gradle --no-daemon -p android -PheikaWebUrl="$HEIKA_WEB_URL" :app:assembleDebug :app:assembleRelease
      - name: Prepare APK artifacts
        id: metadata
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/HEIKA-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/HEIKA-release-unsigned.apk
          cat > artifacts/BUILD-METADATA.txt <<EOF
          Application: HEIKA
          Version name: $version_name
          Version code: $version_code
          Commit SHA: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Release APK: unsigned; for build inspection only, not a signed release package
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: heika-android-v${{ steps.metadata.outputs.version_name }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
