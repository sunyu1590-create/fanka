name: HEIKA Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "lib/native-bridge.ts"
      - "components/Community.tsx"
      - "components/Messages.tsx"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "lib/**"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "lib/native-bridge.ts"
      - "components/Community.tsx"
      - "components/Messages.tsx"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "lib/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heika-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Validate Web bridge and business app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  android-apk:
    name: Build Android APKs
    needs: web-validation
    runs-on: ubuntu-latest
    env:
      HEIKA_WEB_URL: ${{ vars.HEIKA_WEB_URL || 'https://moonclean.shop/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug and release APKs
        run: gradle --no-daemon -p android -PheikaWebUrl="$HEIKA_WEB_URL" :app:assembleDebug :app:assembleRelease
      - name: Prepare APK artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/HEIKA-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/HEIKA-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: heika-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
